
name: Ping Google

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  ping-test:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Google
        run: ping -c 4 google.com

      - name: Forçar erro
        run: exit 1

  ping-teste2:
    runs-on: ubuntu-latest
    needs: ping-test
